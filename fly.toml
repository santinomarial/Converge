app = "converge-inventory-santinomarial"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  JAVA_TOOL_OPTIONS = "-XX:MaxRAMPercentage=75"
  SPRING_PROFILES_ACTIVE = "prod"
  TRACING_SAMPLING_PROBABILITY = "0.1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "30s"
    method = "GET"
    path = "/actuator/health/readiness"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
