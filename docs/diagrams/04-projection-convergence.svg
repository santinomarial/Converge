<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
<title id="title">Projection and convergence</title>
<desc id="description">A winning source-time snapshot anchors the position. Only later deltas count. Earlier late arrivals are retained as absorbed. The incremental checkpoint is compared to an independent full replay; repair is explicit.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1746A2" stroke-width="2"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#5C6B80" stroke-width="2"/></marker></defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="32" y="32" width="1376" height="836" rx="16" fill="#FFFFFF" stroke="#CBD5E4" stroke-width="2"/>
<rect x="52" y="52" width="82" height="92" rx="10" fill="#152B52" stroke="none" stroke-width="1"/>
<text x="93" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">04</text>
<text x="158" y="91" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#152B52">Projection and convergence</text>
<text x="158" y="126" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#5C6B80">Fast incremental writes, independent full-history verification</text>
<line x1="52" y1="162" x2="1388" y2="162" stroke="#CBD5E4" stroke-width="2"/>
<rect x="62" y="186" width="1316" height="40" rx="6" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="78" y="213" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">ONE SKU / LOCATION · ARRIVAL ORDER, SOURCE-TIME SEMANTICS</text>
<rect x="62" y="252" width="284" height="130" rx="11" fill="#EEF8F6" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="62" y="252" width="8" height="130" rx="4" fill="#178277" stroke="none" stroke-width="1"/>
<text x="86" y="286" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Snapshot · 100</text>
<text x="86" y="316" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Latest (occurred_at, seq)</text>
<text x="86" y="338" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">anchor wins</text>
<rect x="396" y="252" width="284" height="130" rx="11" fill="#F1F5FD" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="396" y="252" width="8" height="130" rx="4" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="420" y="286" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Delta · −3</text>
<text x="420" y="316" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">After anchor</text>
<text x="420" y="338" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">included</text>
<rect x="730" y="252" width="284" height="130" rx="11" fill="#FFF7E9" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="730" y="252" width="8" height="130" rx="4" fill="#A66514" stroke="none" stroke-width="1"/>
<text x="754" y="286" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Late delta · +10</text>
<text x="754" y="316" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Before anchor</text>
<text x="754" y="338" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">retained, absorbed</text>
<rect x="1064" y="252" width="284" height="130" rx="11" fill="#F1F5FD" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="1064" y="252" width="8" height="130" rx="4" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="1088" y="286" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Delta · +2</text>
<text x="1088" y="316" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">After anchor</text>
<text x="1088" y="338" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">included</text>
<line x1="346" y1="318" x2="386" y2="318" stroke="#1746A2" stroke-width="3"/>
<polygon points="386.0,318.0 373.0,312.0 373.0,324.0" fill="#1746A2"/>
<line x1="680" y1="318" x2="720" y2="318" stroke="#1746A2" stroke-width="3"/>
<polygon points="720.0,318.0 707.0,312.0 707.0,324.0" fill="#1746A2"/>
<line x1="1014" y1="318" x2="1054" y2="318" stroke="#1746A2" stroke-width="3"/>
<polygon points="1054.0,318.0 1041.0,312.0 1041.0,324.0" fill="#1746A2"/>
<rect x="278" y="430" width="884" height="102" rx="12" fill="#F1F5FD" stroke="#1746A2" stroke-width="2"/>
<text x="720" y="471" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#152B52">100 − 3 + 2 = 99</text>
<text x="720" y="505" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#5C6B80">The absorbed +10 remains auditable but does not change the position.</text>
<rect x="62" y="580" width="1316" height="40" rx="6" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="78" y="607" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">TWO REDUCERS, ONE INVARIANT</text>
<rect x="62" y="638" width="390" height="112" rx="11" fill="#F1F5FD" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="62" y="638" width="8" height="112" rx="4" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="86" y="672" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Incremental checkpoint</text>
<text x="86" y="702" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Ordinary writes update qty and</text>
<text x="86" y="724" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">last_applied_seq atomically.</text>
<rect x="524" y="638" width="390" height="112" rx="11" fill="#EEF8F6" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="524" y="638" width="8" height="112" rx="4" fill="#178277" stroke="none" stroke-width="1"/>
<text x="548" y="672" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Shadow full reducer</text>
<text x="548" y="702" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Rotating batches recompute from</text>
<text x="548" y="724" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">the complete event history.</text>
<rect x="986" y="638" width="392" height="112" rx="11" fill="#FDF0F1" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="986" y="638" width="8" height="112" rx="4" fill="#A51C30" stroke="none" stroke-width="1"/>
<text x="1010" y="672" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Mismatch → explicit replay</text>
<text x="1010" y="702" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Metric + error log surface drift;</text>
<text x="1010" y="724" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">operator rebuilds projection.</text>
<line x1="452" y1="694" x2="514" y2="694" stroke="#1746A2" stroke-width="3"/>
<polygon points="514.0,694.0 501.0,688.0 501.0,700.0" fill="#1746A2"/>
<line x1="914" y1="694" x2="976" y2="694" stroke="#1746A2" stroke-width="3" stroke-dasharray="8 7"/>
<polygon points="976.0,694.0 963.0,688.0 963.0,700.0" fill="#1746A2"/>
<line x1="52" y1="788" x2="1388" y2="788" stroke="#CBD5E4" stroke-width="2"/>
<text x="68" y="819" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#152B52">KEY</text>
<rect x="128" y="802" width="18" height="18" rx="3" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="155" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">Application / core</text>
<rect x="330" y="802" width="18" height="18" rx="3" fill="#178277" stroke="none" stroke-width="1"/>
<text x="357" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">Durable data</text>
<rect x="484" y="802" width="18" height="18" rx="3" fill="#A66514" stroke="none" stroke-width="1"/>
<text x="511" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">Control / review</text>
<rect x="670" y="802" width="18" height="18" rx="3" fill="#A51C30" stroke="none" stroke-width="1"/>
<text x="697" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">Failure / exception</text>
<text x="68" y="855" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C6B80">No automatic mutation follows a shadow mismatch; replay is an explicit administrative operation.</text>
</svg>
