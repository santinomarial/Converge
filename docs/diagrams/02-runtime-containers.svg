<title id="title">Runtime and containers</title>
<desc id="description">The Spring Boot application serves the React console and API and runs asynchronous workers. PostgreSQL stores facts and work, Kafka transports messages, Redis supports rate limits, and telemetry flows to observability services.</desc>
