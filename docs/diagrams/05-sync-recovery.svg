<text x="68" y="819" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#152B52">KEY</text>
<rect x="128" y="802" width="18" height="18" rx="3" fill="#178277" stroke="none" stroke-width="1"/>
<text x="155" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">Durable data</text>
<rect x="282" y="802" width="18" height="18" rx="3" fill="#6946A0" stroke="none" stroke-width="1"/>
<text x="309" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">Event transport</text>
<rect x="460" y="802" width="18" height="18" rx="3" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="487" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">Application / core</text>
<rect x="662" y="802" width="18" height="18" rx="3" fill="#5C6B80" stroke="none" stroke-width="1"/>
<text x="689" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">External system</text>
<rect x="840" y="802" width="18" height="18" rx="3" fill="#A66514" stroke="none" stroke-width="1"/>
<text x="867" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">Control / review</text>
<rect x="1026" y="802" width="18" height="18" rx="3" fill="#A51C30" stroke="none" stroke-width="1"/>
<text x="1053" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">Failure / exception</text>
<text x="68" y="855" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C6B80">Compensation records intent and re-pushes; it does not pretend to undo an accepted remote write.</text>
</svg>
