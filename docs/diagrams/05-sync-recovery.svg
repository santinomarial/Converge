<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
<title id="title">Outbound sync and recovery</title>
<desc id="description">The transactional outbox creates durable sync attempts. Workers rate-limit and circuit-break calls. Retry probes remote state after ambiguity. Terminal failures open exceptions; partial success starts a causally linked compensation cycle.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1746A2" stroke-width="2"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#5C6B80" stroke-width="2"/></marker></defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="32" y="32" width="1376" height="836" rx="16" fill="#FFFFFF" stroke="#CBD5E4" stroke-width="2"/>
<rect x="52" y="52" width="82" height="92" rx="10" fill="#152B52" stroke="none" stroke-width="1"/>
<text x="93" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">05</text>
<text x="158" y="91" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#152B52">Outbound sync and recovery</text>
<text x="158" y="126" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#5C6B80">A remote write cannot be rolled back by a local transaction</text>
<line x1="52" y1="162" x2="1388" y2="162" stroke="#CBD5E4" stroke-width="2"/>
<rect x="62" y="186" width="1316" height="40" rx="6" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="78" y="213" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">NORMAL PATH</text>
<line x1="292" y1="311" x2="330" y2="311" stroke="#1746A2" stroke-width="3"/>
<polygon points="330.0,311.0 317.0,305.0 317.0,317.0" fill="#1746A2"/>
<line x1="570" y1="311" x2="608" y2="311" stroke="#1746A2" stroke-width="3"/>
<polygon points="608.0,311.0 595.0,305.0 595.0,317.0" fill="#1746A2"/>
<line x1="848" y1="311" x2="886" y2="311" stroke="#1746A2" stroke-width="3"/>
<polygon points="886.0,311.0 873.0,305.0 873.0,317.0" fill="#1746A2"/>
<line x1="1126" y1="311" x2="1164" y2="311" stroke="#1746A2" stroke-width="3"/>
<polygon points="1164.0,311.0 1151.0,305.0 1151.0,317.0" fill="#1746A2"/>
<rect x="62" y="246" width="230" height="127" rx="11" fill="#EEF8F6" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="62" y="246" width="8" height="127" rx="4" fill="#178277" stroke="none" stroke-width="1"/>
<text x="86" y="280" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Outbox</text>
<text x="86" y="310" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Committed with</text>
<text x="86" y="332" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">ledger position</text>
<rect x="340" y="246" width="230" height="127" rx="11" fill="#F6F1FB" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="340" y="246" width="8" height="127" rx="4" fill="#6946A0" stroke="none" stroke-width="1"/>
<text x="364" y="280" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Kafka relay</text>
<text x="364" y="310" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Publish position</text>
<text x="364" y="332" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">change</text>
<rect x="618" y="246" width="230" height="127" rx="11" fill="#F1F5FD" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="618" y="246" width="8" height="127" rx="4" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="642" y="280" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Sync planner</text>
<text x="642" y="310" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">One durable attempt</text>
<text x="642" y="332" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">per mapped target</text>
<rect x="896" y="246" width="230" height="127" rx="11" fill="#F1F5FD" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="896" y="246" width="8" height="127" rx="4" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="920" y="280" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Worker</text>
<text x="920" y="310" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Rate limit, breaker</text>
<text x="920" y="332" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">and retry policy</text>
<rect x="1174" y="246" width="204" height="127" rx="11" fill="#F8FAFD" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="1174" y="246" width="8" height="127" rx="4" fill="#5C6B80" stroke="none" stroke-width="1"/>
<text x="1198" y="280" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Remote API</text>
<text x="1198" y="310" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Shopify or</text>
<text x="1198" y="332" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Square write</text>
<rect x="62" y="440" width="1316" height="40" rx="6" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="78" y="467" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">OUTCOMES AND RECOVERY</text>
<rect x="62" y="506" width="390" height="124" rx="11" fill="#EEF8F6" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="62" y="506" width="8" height="124" rx="4" fill="#178277" stroke="none" stroke-width="1"/>
<text x="86" y="540" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Confirmed success</text>
<text x="86" y="570" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Mark attempt SUCCEEDED;</text>
<text x="86" y="592" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">do not write again.</text>
<rect x="524" y="506" width="390" height="124" rx="11" fill="#FFF7E9" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="524" y="506" width="8" height="124" rx="4" fill="#A66514" stroke="none" stroke-width="1"/>
<text x="548" y="540" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Transient / ambiguous result</text>
<text x="548" y="570" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Requeue with backoff. Retry</text>
<text x="548" y="592" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">reads remote state first.</text>
<rect x="986" y="506" width="392" height="124" rx="11" fill="#FDF0F1" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="986" y="506" width="8" height="124" rx="4" fill="#A51C30" stroke="none" stroke-width="1"/>
<text x="1010" y="540" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Terminal failure</text>
<text x="1010" y="570" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Mark FAILED and open a</text>
<text x="1010" y="592" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">critical operator exception.</text>
<path d="M 1098 640 L 1098 697 L 968 697" fill="none" stroke="#5C6B80" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 7"/>
<polygon points="968.0,697.0 981.0,703.0 981.0,691.0" fill="#5C6B80"/>
<rect x="524" y="672" width="444" height="94" rx="11" fill="#FFF7E9" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="524" y="672" width="8" height="94" rx="4" fill="#A66514" stroke="none" stroke-width="1"/>
<text x="548" y="706" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Partial success → compensation</text>
<text x="548" y="736" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Append zero-delta correction; start fresh sync cycle.</text>
