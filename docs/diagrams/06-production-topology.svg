<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
<title id="title">Production topology</title>
<desc id="description">A continuously running Fly machine serves the console and API and runs workers. Managed PostgreSQL, Kafka and Redis are required. Commerce platforms call webhooks and receive outbound syncs. Health checks and metrics support operations.</desc>
