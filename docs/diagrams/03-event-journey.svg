<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
<title id="title">Inventory event journey</title>
<desc id="description">Webhooks are verified and stored before acknowledgment. Kafka triggers normalization, identity mapping, atomic ledger projection and outbox creation, then outbound sync attempts.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1746A2" stroke-width="2"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#5C6B80" stroke-width="2"/></marker></defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="32" y="32" width="1376" height="836" rx="16" fill="#FFFFFF" stroke="#CBD5E4" stroke-width="2"/>
<rect x="52" y="52" width="82" height="92" rx="10" fill="#152B52" stroke="none" stroke-width="1"/>
<text x="93" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">03</text>
<text x="158" y="91" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#152B52">Inventory event journey</text>
<text x="158" y="126" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#5C6B80">From a signed webhook to a durable position and outbound work</text>
<line x1="52" y1="162" x2="1388" y2="162" stroke="#CBD5E4" stroke-width="2"/>
<rect x="62" y="188" width="1316" height="40" rx="6" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="78" y="215" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">PRIMARY FLOW · DURABLE CAPTURE BEFORE ACKNOWLEDGEMENT</text>
<line x1="298" y1="326" x2="322" y2="326" stroke="#1746A2" stroke-width="3"/>
<polygon points="322.0,326.0 309.0,320.0 309.0,332.0" fill="#1746A2"/>
<line x1="568" y1="326" x2="592" y2="326" stroke="#1746A2" stroke-width="3"/>
<polygon points="592.0,326.0 579.0,320.0 579.0,332.0" fill="#1746A2"/>
<line x1="838" y1="326" x2="862" y2="326" stroke="#1746A2" stroke-width="3"/>
<polygon points="862.0,326.0 849.0,320.0 849.0,332.0" fill="#1746A2"/>
<line x1="1108" y1="326" x2="1132" y2="326" stroke="#1746A2" stroke-width="3"/>
<polygon points="1132.0,326.0 1119.0,320.0 1119.0,332.0" fill="#1746A2"/>
<rect x="62" y="252" width="236" height="175" rx="11" fill="#F8FAFD" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="62" y="252" width="8" height="175" rx="4" fill="#5C6B80" stroke="none" stroke-width="1"/>
<text x="86" y="286" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">01 · Receive</text>
<text x="86" y="316" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Verify HMAC</text>
<text x="86" y="338" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Shopify / Square</text>
<text x="86" y="360" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">webhook</text>
<rect x="332" y="252" width="236" height="175" rx="11" fill="#EEF8F6" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="332" y="252" width="8" height="175" rx="4" fill="#178277" stroke="none" stroke-width="1"/>
<text x="356" y="286" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">02 · Capture</text>
<text x="356" y="316" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Commit raw_webhook</text>
<text x="356" y="338" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">in PostgreSQL</text>
<text x="356" y="360" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">then return 200</text>
<rect x="602" y="252" width="236" height="175" rx="11" fill="#F6F1FB" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="602" y="252" width="8" height="175" rx="4" fill="#6946A0" stroke="none" stroke-width="1"/>
<text x="626" y="286" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">03 · Normalize</text>
<text x="626" y="316" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">inventory.raw</text>
<text x="626" y="338" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Kafka consumer</text>
<text x="626" y="360" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">resolves identity</text>
<rect x="872" y="252" width="236" height="175" rx="11" fill="#F1F5FD" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="872" y="252" width="8" height="175" rx="4" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="896" y="286" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">04 · Project</text>
<text x="896" y="316" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Append event, update</text>
<text x="896" y="338" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">position and outbox</text>
<text x="896" y="360" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">in one transaction</text>
<rect x="1142" y="252" width="236" height="175" rx="11" fill="#F1F5FD" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="1142" y="252" width="8" height="175" rx="4" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="1166" y="286" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">05 · Sync</text>
<text x="1166" y="316" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Relay change event</text>
<text x="1166" y="338" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">plan attempts, push</text>
<text x="1166" y="360" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">mapped targets</text>
<rect x="62" y="487" width="1316" height="40" rx="6" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="78" y="514" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">VISIBLE BRANCHES · NEVER SILENTLY INVENT INVENTORY</text>
<rect x="62" y="550" width="395" height="128" rx="11" fill="#FFF7E9" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="62" y="550" width="8" height="128" rx="4" fill="#A66514" stroke="none" stroke-width="1"/>
<text x="86" y="584" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Duplicate delivery</text>
<text x="86" y="614" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">PostgreSQL uniqueness keeps one</text>
<text x="86" y="636" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">raw record and one ledger fact.</text>
<rect x="522" y="550" width="395" height="128" rx="11" fill="#FFF7E9" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="522" y="550" width="8" height="128" rx="4" fill="#A66514" stroke="none" stroke-width="1"/>
<text x="546" y="584" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Missing mapping</text>
<text x="546" y="614" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Quarantine the payload; an</text>
<text x="546" y="636" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">operator resolves the identity.</text>
<rect x="982" y="550" width="396" height="128" rx="11" fill="#FDF0F1" stroke="#CBD5E4" stroke-width="1.6"/>
<rect x="982" y="550" width="8" height="128" rx="4" fill="#A51C30" stroke="none" stroke-width="1"/>
<text x="1006" y="584" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#152B52">Persistent drift</text>
<text x="1006" y="614" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">Second non-zero observation</text>
<text x="1006" y="636" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#1D2D47">opens an exception.</text>
<line x1="52" y1="788" x2="1388" y2="788" stroke="#CBD5E4" stroke-width="2"/>
<text x="68" y="819" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#152B52">KEY</text>
<rect x="128" y="802" width="18" height="18" rx="3" fill="#5C6B80" stroke="none" stroke-width="1"/>
<text x="155" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">External system</text>
<rect x="306" y="802" width="18" height="18" rx="3" fill="#178277" stroke="none" stroke-width="1"/>
<text x="333" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">Durable data</text>
<rect x="460" y="802" width="18" height="18" rx="3" fill="#6946A0" stroke="none" stroke-width="1"/>
<text x="487" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">Event transport</text>
<rect x="638" y="802" width="18" height="18" rx="3" fill="#1746A2" stroke="none" stroke-width="1"/>
<text x="665" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">Application / core</text>
<rect x="840" y="802" width="18" height="18" rx="3" fill="#A66514" stroke="none" stroke-width="1"/>
<text x="867" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">Control / review</text>
<rect x="1026" y="802" width="18" height="18" rx="3" fill="#A51C30" stroke="none" stroke-width="1"/>
<text x="1053" y="817" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1D2D47">Failure / exception</text>
<text x="68" y="855" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C6B80">The source event is preserved; replay uses the same append-only log as the live projection.</text>
</svg>
