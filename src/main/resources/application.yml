spring:
  application:
    name: converge
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/converge}
    username: ${DATABASE_USERNAME:converge}
    password: ${DATABASE_PASSWORD:converge}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      group-id: converge-normalizer

connectors:
  shopify:
    base-url: ${SHOPIFY_BASE_URL:http://localhost:9999}
    access-token: ${SHOPIFY_ACCESS_TOKEN:development-token}
    webhook-secret: ${SHOPIFY_WEBHOOK_SECRET:development-secret}
  square:
    base-url: ${SQUARE_BASE_URL:http://localhost:9998}
    access-token: ${SQUARE_ACCESS_TOKEN:development-token}
    webhook-signature-key: ${SQUARE_WEBHOOK_SIGNATURE_KEY:development-square-secret}
    notification-url: ${SQUARE_NOTIFICATION_URL:http://localhost:8080/webhooks/square}

reconciliation:
  poll-delay: ${RECONCILIATION_POLL_DELAY:60s}
  initial-delay: ${RECONCILIATION_INITIAL_DELAY:60s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
